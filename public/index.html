
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipSpark AI - Video Clipper</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101426;color:white;font-family:Arial,sans-serif;padding:22px}
main{max-width:650px;margin:30px auto;background:#1b2340;padding:25px;border-radius:18px}
h1{color:#8b9cff;text-align:center}
p{color:#cbd2ed;line-height:1.5}
input,button{width:100%;padding:13px;margin:10px 0;border-radius:9px;border:0}
input{background:#fff;color:#111}
button{background:#687cff;color:white;font-weight:bold;font-size:16px}
button:disabled{opacity:.5}
video{width:100%;margin-top:15px;border-radius:10px}
#status{color:#9fffc4;overflow-wrap:anywhere}
a{color:#9fffc4}
</style>
</head>
<body>
<main>
<h1>ClipSpark AI</h1>
<p style="text-align:center">Turn long videos into short clips.</p>

<label>1. Upload your video</label>
<input type="file" id="videoFile" accept="video/*">

<video id="preview" controls hidden></video>

<label>2. Clip start time (seconds)</label>
<input type="number" id="start" value="0" min="0">

<label>3. Clip end time (seconds)</label>
<input type="number" id="end" value="30" min="1">

<button id="generate">Generate MP4 Clip</button>

<p id="status">Choose a video to begin.</p>
<video id="result" controls hidden></video>
<a id="download" hidden download="clipspark-clip.mp4">Download your MP4 clip</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

<script>
const fileInput=document.getElementById("videoFile");
const preview=document.getElementById("preview");
const result=document.getElementById("result");
const status=document.getElementById("status");
const button=document.getElementById("generate");
let selectedFile=null;
let ffmpeg=null;
let outputURL=null;

fileInput.addEventListener("change",()=>{
 selectedFile=fileInput.files[0];
 if(!selectedFile)return;
 preview.src=URL.createObjectURL(selectedFile);
 preview.hidden=false;
 status.textContent="Video ready. Choose start and end times.";
});

async function loadEngine(){
 if(ffmpeg)return;
 status.textContent="Loading free video processing engine. Please wait...";
 const {FFmpeg}=FFmpegWASM;
 const {toBlobURL}=FFmpegUtil;
 ffmpeg=new FFmpeg();
 const base="https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";
 await ffmpeg.load({
  coreURL:await toBlobURL(base+"/ffmpeg-core.js","text/javascript"),
  wasmURL:await toBlobURL(base+"/ffmpeg-core.wasm","application/wasm")
 });
}

button.addEventListener("click",async()=>{
 if(!selectedFile){
  status.textContent="Please upload a video first.";
  return;
 }
 const start=Number(document.getElementById("start").value);
 const end=Number(document.getElementById("end").value);
 if(!Number.isFinite(start)||!Number.isFinite(end)||start<0||end<=start){
  status.textContent="Please enter a valid start and end time.";
  return;
 }
 button.disabled=true;
 result.hidden=true;
 document.getElementById("download").hidden=true;
 try{
  await loadEngine();
  status.textContent="Processing your video. Please wait...";
  const {fetchFile}=FFmpegUtil;
  const ext=(selectedFile.name.split(".").pop()||"mp4").replace(/[^a-z0-9]/gi,"");
  const input="input."+ext;
  await ffmpeg.writeFile(input,await fetchFile(selectedFile));
  await ffmpeg.exec([
   "-ss",String(start),
   "-i",input,
   "-t",String(end-start),
   "-c:v","libx264",
   "-preset","ultrafast",
   "-crf","28",
   "-c:a","aac",
   "-movflags","+faststart",
   "output.mp4"
  ]);
  const data=await ffmpeg.readFile("output.mp4");
  const blob=new Blob([data.buffer],{type:"video/mp4"});
  if(outputURL)URL.revokeObjectURL(outputURL);
  outputURL=URL.createObjectURL(blob);
  result.src=outputURL;
  result.hidden=false;
  const link=document.getElementById("download");
  link.href=outputURL;
  link.hidden=false;
  status.textContent="Your MP4 clip is ready!";
 }catch(error){
  status.textContent="Processing failed: "+error.message;
 }finally{
  button.disabled=false;
 }
});
</script>
</body>
</html>
